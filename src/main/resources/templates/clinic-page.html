<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý lịch khám</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h2 class="text-primary mb-4">Hệ Thống Quản Lý Đặt Lịch Khám</h2>

<div class="card mb-4">
    <div class="card-body">
        <h5 class="card-title">Đăng ký lịch khám mới</h5>
        <form th:action="@{/clinic/add}" th:object="${newAppointment}" method="post" class="row g-3">
            <div class="col-md-4">
                <input type="text" th:field="*{patientName}" class="form-control" placeholder="Tên bệnh nhân">
                <small class="text-danger" th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}"></small>
            </div>
            <div class="col-md-3">
                <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="Số điện thoại">
                <small class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></small>
            </div>
            <div class="col-md-2">
                <input type="time" th:field="*{appointmentTime}" class="form-control">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-success w-100">Đăng ký</button>
            </div>
        </form>
    </div>
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>Giờ khám</th>
        <th>Bệnh nhân</th>
        <th>SĐT</th>
        <th>Lý do</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="app : ${appointments}">
        <td th:text="${app.appointmentTime}"></td>
        <td th:text="${app.patientName}"></td>
        <td th:text="${app.phoneNumber}"></td>
        <td th:text="${app.reason}"></td>
        <td>
            <a th:href="@{/clinic/call/{id}(id=${app.id})}" class="btn btn-sm btn-primary">Gọi khám</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
